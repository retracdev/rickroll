<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GamerNow - Free Online Games</title>
  <meta name="description" content="Play free online games instantly. No downloads.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,6 62,36 94,38 69,58 78,90 50,72 22,90 31,58 6,38 38,36' fill='%23ff3d9a' stroke='%236a1b9a' stroke-width='8' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="games.css">
</head>
<body class="gn">
  <main id="stage" class="stage gn-stage">
    <div id="floaters" class="gn-floaters" aria-hidden="true"></div>

    <section class="gn-center">
      <img class="gn-logo" src="../assets/games/gamernow-logo.png" alt="GamerNow" width="1000" height="334">
      <p class="gn-tagline">Free online games. No downloads. Just play!</p>

      <div class="gn-slot">
        <div id="loader" class="gn-loader" role="progressbar" aria-label="Loading games" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="gn-bar"><div id="fill" class="gn-fill"></div></div>
          <div class="gn-loader-text">
            <span id="tip">Warming up the arcade…</span>
            <span id="pct">0%</span>
          </div>
        </div>

        <button id="play" class="gn-play" type="button" data-rickroll-start aria-label="Play Now!" hidden>
          <svg class="pn-star pn-star-a" viewBox="0 0 100 100" aria-hidden="true"><use href="#gn-star"/></svg>
          <svg class="pn-star pn-star-b" viewBox="0 0 100 100" aria-hidden="true"><use href="#gn-star"/></svg>
          <svg class="pn-star pn-star-c" viewBox="0 0 100 100" aria-hidden="true"><use href="#gn-star"/></svg>
          <svg class="pn-spark pn-spark-a" viewBox="0 0 100 100" aria-hidden="true"><use href="#gn-spark"/></svg>
          <svg class="pn-spark pn-spark-b" viewBox="0 0 100 100" aria-hidden="true"><use href="#gn-spark"/></svg>

          <span class="pn-word" data-text="Play Now!" aria-hidden="true"><span class="pn-fill">Play Now!</span></span>

          <svg class="pn-arrow" viewBox="-20 -20 160 160" aria-hidden="true">
            <defs>
              <linearGradient id="pn-arrow-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ff9ccf"/>
                <stop offset="0.5" stop-color="#ff3d9a"/>
                <stop offset="1" stop-color="#d1126f"/>
              </linearGradient>
              <path id="pn-arrow-shape" d="M8 42 H64 V18 L112 60 L64 102 V78 H8 Z"/>
            </defs>
            <use href="#pn-arrow-shape" fill="#5b1486" stroke="#5b1486" stroke-width="30" stroke-linejoin="round"/>
            <use href="#pn-arrow-shape" fill="#fff" stroke="#fff" stroke-width="19" stroke-linejoin="round"/>
            <use href="#pn-arrow-shape" fill="url(#pn-arrow-fill)" stroke="#c4146b" stroke-width="3" stroke-linejoin="round"/>
            <path d="M16 48 H70 V30 L100 56" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>

    <p class="gn-footer">&copy; GamerNow &middot; Free browser games</p>
  </main>

  <!-- Candy star + sparkle shapes, referenced by <use> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="gn-star" viewBox="0 0 100 100">
      <polygon points="50,6 62,36 94,38 69,58 78,90 50,72 22,90 31,58 6,38 38,36" fill="#ffc933" stroke="#6a1b9a" stroke-width="9" stroke-linejoin="round"/>
      <polygon points="50,18 58,38 80,40 63,53 69,75 50,63" fill="#fff" fill-opacity="0.4"/>
    </symbol>
    <symbol id="gn-spark" viewBox="0 0 100 100">
      <path d="M50 4 C54 36 64 46 96 50 C64 54 54 64 50 96 C46 64 36 54 4 50 C36 46 46 36 50 4 Z" fill="#fff" stroke="#ff7cc0" stroke-width="5" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <!-- The video player, "You've been Rickrolled!" section and falling-photo layer are added by ../script.js. -->

  <script src="../script.js"></script>
  <script src="games.js"></script>
</body>
</html>
