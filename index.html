<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
  <meta name="description" content="Just a quick loading screen. Nothing to see here.">
  <link rel="icon" href="assets/rickroll.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" class="stage" aria-live="polite">
    <div id="loader" class="loader" role="status" aria-label="Loading">
      <div class="spinner"></div>
      <p class="loader-text">Loading…</p>
    </div>

    <button id="continue" class="continue" type="button" hidden>
      <span>Continue</span>
      <svg class="arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </main>

  <div id="player" class="player" hidden></div>

  <script src="script.js"></script>
</body>
</html>
