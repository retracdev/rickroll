<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security check</title>
  <meta name="description" content="A quick security check.">
  <link rel="icon" href="assets/rickroll.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" class="stage">
    <section class="card" aria-labelledby="card-title">
      <h1 id="card-title">Quick security check</h1>
      <p class="sub">Just confirming you're a real human. It only takes a second.</p>

      <button id="check" class="check" type="button" role="checkbox" aria-checked="false">
        <span class="box">
          <span class="box-spin"></span>
          <svg class="tick" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span id="check-label" class="check-label">I'm not a robot</span>
      </button>

      <button id="verify" class="verify" type="button" disabled>
        <span>Verify</span>
        <svg class="arrow" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>
  </main>

  <div id="player" class="player" hidden>
    <div id="yt"></div>
    <div class="shield"></div>
    <button id="unmute" class="unmute" type="button" hidden>🔊 Tap to unmute</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
